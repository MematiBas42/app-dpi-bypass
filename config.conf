# App DPI Bypass Yapılandırma Dosyası
# Mod: preset | manual
DPI_MODE="preset"

# Hazır Profil (DPI_MODE="preset" olduğunda)
# Seçenekler:
#   discord_optimal       : fake + md5sig (Discord & WebRTC ses/medya için optimize)
#   split_sni_compatible  : split=sni (Maksimum çekirdek uyumluluğu, md5sig gerekmez)
#   fake_badsum_autottl   : fake + badsum + autottl=-1 (Katı ISP sansürleri için)
#   multisplit_midsni     : multisplit (pos: 2,midsni)
#   disorder_sni          : disorder (pos: sni)
PRESET_NAME="discord_optimal"

# Manuel Parametreler (DPI_MODE="manual" olduğunda)
TCP_DESYNC="fake"
TCP_SPLIT_POS="sni"
TCP_FOOLING="md5sig"
TCP_TTL_MODE="none"
TCP_TTL_VALUE="8"
TCP_PORTS="80,443,2053,2083,2087,2096,8443"

UDP_DESYNC="fake"
UDP_REPEATS="2"
UDP_PORTS="50000-65535,19294-19344"
UDP_FILTER_L7="discord"

# Uzman Kullanıcı Ek Parametreleri (nfqws raw bayrakları, örn: --dpi-desync-fake-tls=...)
CUSTOM_EXTRA_ARGS=""

# Yerel Profil (DPI_MODE="custom" olduğunda)
CUSTOM_PROFILE_NAME=""
CUSTOM_PROFILE_ARGS=""

# Otomatik Test Hedefi (Auto-Tune)
AUTO_TARGET_DOMAIN="discord.com"

# Per-App DoH / DNS Ayarları (Zygisk Entegrasyonu)
DNS_ENABLED="1"
DNS_PRESET="cloudflare"
DNS_UPSTREAM="https://1.1.1.1/dns-query"

